{% extends "base.html" %}
{% block title %}Add Menu Item{% endblock %}

{% block content %}
<h2 style="text-align:center; margin-bottom:30px;">Add New Menu Item 🥐</h2>

<form action="/menu/" method="post" enctype="multipart/form-data" style="max-width:600px; margin:auto; display:flex; flex-direction:column; gap:15px;">

  <!-- BASIC INFORMATION -->
  <label>🍽️ Title *</label>
  <input type="text" name="title" placeholder="e.g. Croissant" required>

  <label>📝 Description</label>
  <textarea name="description" rows="2" placeholder="Brief description of this item..."></textarea>

  <label>📜 Recipe / Notes</label>
  <textarea name="recipe" rows="3" placeholder="Internal recipe steps or ingredients (optional)"></textarea>
  <small style="color:#666;">Markdown supported for recipe only: headings, bullet lists, bold, italics, links, and inline code.</small>

  <label>💰 Price *</label>
  <input type="number" name="price" step="0.01" placeholder="e.g. 12.99" required>

  <!-- CLASSIFICATION -->
  <label>🌍 Origin *</label>
  <select name="origin" required>
    <option value="">Select origin...</option>
    <option value="fusion">Fusion</option>
    <option value="american">American</option>
    <option value="french">French</option>
    <option value="italian">Italian</option>
    <option value="germany">Germany</option>
    <option value="japanese">Japanese</option>
    <option value="chinese">Chinese</option>
    <option value="thai">Thai</option>
    <option value="vietnamese">Vietnamese</option>
    <option value="korean">Korean</option>
    <option value="taiwanese">Taiwanese</option>
  </select>

  <label>📂 Category *</label>
  <select name="category" required>
    <option value="">Select category...</option>
    <option value="pastry">Pastry</option>
    <option value="dessert">Dessert</option>
    <option value="soup">Soup</option>
    <option value="drink">Drink</option>
    <option value="entree">Entrée</option>
    <option value="appetizer">Appetizer</option>
    <option value="rice_and_noodles">Rice & Noodles</option>
  </select>

  <label>🏷️ Tags (comma-separated)</label>
  <input type="text" name="tags" placeholder="e.g. sweet, flaky, buttery">

  <!-- FLAVOR & DIETARY -->
  <label>👅 Flavor Profile (comma-separated)</label>
  <input type="text" name="flavor_profiles" placeholder="e.g. sweet, savory, spicy">

<label>🥗 Dietary Features</label>
<div class="checkbox-group">
    <!-- DIETARY PREFERENCES -->
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="vegetarian">
        <span>🥦 Vegetarian</span>
    </label>
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="vegan">
        <span>🥕 Vegan</span>
    </label>

    <!-- MAJOR ALLERGENS -->
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="gluten_free">
        <span>✅ Gluten-Free</span>
    </label>
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="contains_gluten">
        <span>🌾 Contains Gluten</span>
    </label>
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="contains_dairy">
        <span>🧀 Contains Dairy</span>
    </label>
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="contains_nuts">
        <span>🥜 Contains Nuts</span>
    </label>

    <!-- PROTEIN SOURCES (only uncommon ones) -->
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="contains_pork">
        <span>🐷 Contains Pork</span>
    </label>
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="contains_shellfish">
        <span>🦐 Contains Shellfish</span>
    </label>

    <!-- ALCOHOL CONTENT -->
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="contains_alcohol">
        <span>🍷 Contains Alcohol</span>
    </label>

    <!-- FLAVOR PROFILE -->
    <label class="checkbox-label">
        <input type="checkbox" name="dietary_features" value="spicy">
        <span>🌶️ Spicy</span>
    </label>
</div>

  <!-- AVAILABILITY & IMAGE -->
  <label>🟢 Available?</label>
  <select name="is_available">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>

  <label>🖼️ Primary Image *</label>
  <input type="file" name="image" accept="image/*" required>

  <label>📸 Gallery Images (optional)</label>
  <input type="file" name="images" accept="image/*" multiple>

  <button type="submit" class="btn" style="margin-top:20px;">Create Item</button>
</form>

<div style="text-align: center; margin-top: 20px;">
  <a href="/menu/view" style="color: #666; text-decoration: none;">← Back to Menu</a>
</div>

{% endblock %}
